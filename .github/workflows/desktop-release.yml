name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  windows-x64:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Validate release tag
        if: github.event_name == 'push'
        run: node apps/desktop/scripts/check-release-tag.mjs "$env:GITHUB_REF_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and typecheck Desktop
        run: |
          pnpm --filter @moonshot-ai/kimi-code-desktop test
          pnpm --filter @moonshot-ai/kimi-code-desktop typecheck

      - name: Build Desktop
        run: |
          pnpm --filter @moonshot-ai/kimi-code-desktop licenses:check
          pnpm --filter @moonshot-ai/kimi-code-desktop build

      - name: Run Windows Desktop Electron E2E
        run: |
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            pnpm --filter @moonshot-ai/kimi-code-desktop e2e
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) { break }
            if ($attempt -eq 2) { exit $exitCode }
            Write-Warning 'Desktop E2E failed; retrying once with a fresh fixture.'
          }

      - name: Build Windows package
        run: pnpm --filter @moonshot-ai/kimi-code-desktop exec electron-builder --win portable --x64 --publish never

      - name: Inspect and smoke packaged application
        run: |
          pnpm --filter @moonshot-ai/kimi-code-desktop release:inspect-package windows-x64
          pnpm --filter @moonshot-ai/kimi-code-desktop release:smoke-package windows-x64

      - name: Prepare release assets
        run: pnpm --filter @moonshot-ai/kimi-code-desktop release:artifacts prepare windows-x64

      - name: Upload Windows assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows-x64
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/desktop/release/Kimi-Code-Desktop-*-x64-portable.exe
            apps/desktop/release/Kimi-Code-Desktop-*-x64-portable.exe.sha256

  macos-arm64:
    name: macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Validate release tag
        if: github.event_name == 'push'
        run: node apps/desktop/scripts/check-release-tag.mjs "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and typecheck Desktop
        run: |
          pnpm --filter @moonshot-ai/kimi-code-desktop test
          pnpm --filter @moonshot-ai/kimi-code-desktop typecheck

      - name: Build Desktop
        run: |
          pnpm --filter @moonshot-ai/kimi-code-desktop licenses:check
          pnpm --filter @moonshot-ai/kimi-code-desktop build

      - name: Build macOS package
        run: pnpm --filter @moonshot-ai/kimi-code-desktop exec electron-builder --mac dmg --arm64 --publish never

      - name: Inspect and smoke packaged application
        run: |
          pnpm --filter @moonshot-ai/kimi-code-desktop release:inspect-package macos-arm64
          pnpm --filter @moonshot-ai/kimi-code-desktop release:smoke-package macos-arm64

      - name: Verify architecture and DMG
        run: |
          app="apps/desktop/release/mac-arm64/Kimi Code Desktop.app"
          if [[ ! -d "$app" ]]; then app="apps/desktop/release/mac/Kimi Code Desktop.app"; fi
          file "$app/Contents/MacOS/Kimi Code Desktop" | grep -q arm64
          file "$app/Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/darwin-arm64/pty.node" | grep -q arm64
          hdiutil verify "apps/desktop/release/Kimi-Code-Desktop-$(node -p "require('./apps/desktop/package.json').version")-arm64.dmg"

      - name: Prepare release assets
        run: pnpm --filter @moonshot-ai/kimi-code-desktop release:artifacts prepare macos-arm64

      - name: Upload macOS assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-macos-arm64
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/desktop/release/Kimi-Code-Desktop-*-arm64.dmg
            apps/desktop/release/Kimi-Code-Desktop-*-arm64.dmg.sha256

  linux-x64:
    name: Linux x64 AppImage and DEB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libopenjp2-tools xvfb

      - name: Validate release tag
        if: github.event_name == 'push'
        run: node apps/desktop/scripts/check-release-tag.mjs "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and typecheck Desktop
        run: |
          pnpm --filter @moonshot-ai/kimi-code-desktop test
          pnpm --filter @moonshot-ai/kimi-code-desktop typecheck

      - name: Build Desktop
        run: |
          pnpm --filter @moonshot-ai/kimi-code-desktop licenses:check
          pnpm --filter @moonshot-ai/kimi-code-desktop build

      - name: Build Linux packages
        run: pnpm --filter @moonshot-ai/kimi-code-desktop exec electron-builder --linux AppImage deb --x64 --publish never

      - name: Inspect and smoke packaged application
        run: |
          pnpm --filter @moonshot-ai/kimi-code-desktop release:inspect-package linux-x64
          xvfb-run -a pnpm --filter @moonshot-ai/kimi-code-desktop release:smoke-package linux-x64

      - name: Verify architecture and package metadata
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          file apps/desktop/release/linux-unpacked/kimi-code-desktop | grep -q 'x86-64'
          file apps/desktop/release/linux-unpacked/resources/app.asar.unpacked/node_modules/node-pty/build/Release/pty.node | grep -q 'x86-64'
          dpkg-deb --info "apps/desktop/release/Kimi-Code-Desktop-${version}-x64.deb"
          extract_dir="$RUNNER_TEMP/kimi-code-appimage"
          mkdir -p "$extract_dir"
          (cd "$extract_dir" && "$GITHUB_WORKSPACE/apps/desktop/release/Kimi-Code-Desktop-${version}-x64.AppImage" --appimage-extract >/dev/null)
          test -x "$extract_dir/squashfs-root/kimi-code-desktop"

      - name: Prepare release assets
        run: pnpm --filter @moonshot-ai/kimi-code-desktop release:artifacts prepare linux-x64

      - name: Upload Linux assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-linux-x64
          retention-days: 3
          if-no-files-found: error
          path: |
            apps/desktop/release/Kimi-Code-Desktop-*-x64.AppImage
            apps/desktop/release/Kimi-Code-Desktop-*-x64.AppImage.sha256
            apps/desktop/release/Kimi-Code-Desktop-*-x64.deb
            apps/desktop/release/Kimi-Code-Desktop-*-x64.deb.sha256

  publish:
    name: Publish Desktop release
    needs:
      - windows-x64
      - macos-arm64
      - linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist-desktop-release

      - name: Verify release assets
        run: node apps/desktop/scripts/release-artifacts.mjs verify dist-desktop-release

      - name: Create or update GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Kimi Code Desktop $version"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Kimi Code Desktop $version"
          fi
          gh release upload "$GITHUB_REF_NAME" dist-desktop-release/* --clobber
